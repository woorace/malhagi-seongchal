<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>듣기·말하기 성찰일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EBEEF1; --sf:#FFFFFF; --ink:#15222D; --mut:#64747F;
  --line:#D4DBE1; --teal:#24645F; --amber:#C98A0E; --plum:#8A4E7B;
  --tealsoft:#E9F2F1; --ambersoft:#FBF3E2; --plumsoft:#F4ECF2;
  color-scheme:light;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);}
body{
  color:var(--ink); min-height:100vh;
  padding:0 18px calc(70px + env(safe-area-inset-bottom));
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:14px; -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
[hidden]{display:none !important}
#app{max-width:660px;margin:0 auto;}
.sf{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:700;letter-spacing:-.01em;}

/* ── 공통 타이포 ── */
.hero{font-size:clamp(30px,7.6vw,46px);line-height:1.24;margin:18px 0 8px;}
.sub{font-size:15px;color:var(--mut);margin:0 0 20px;}
.lede{font-size:15px;line-height:1.92;color:var(--mut);max-width:47ch;}
.note{font-size:13.5px;line-height:1.85;color:var(--mut);
  border-left:3px solid var(--teal);padding:3px 0 3px 14px;margin:24px 0;}
.note strong{color:var(--ink);}
.warn{border-left:3px solid var(--plum);padding:3px 0 3px 14px;margin:18px 0;
  font-size:13.5px;line-height:1.85;color:var(--mut);}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:22px;}
h2.h,h3.h{font-size:17px;margin:38px 0 14px;}
h4.h{font-size:15px;margin:26px 0 10px;}
.body{font-size:14.5px;line-height:1.95;color:var(--mut);}
.body strong{color:var(--ink);font-weight:700;}
.phase{font-size:13px;font-weight:700;color:var(--teal);}
.cnt{font-size:13px;color:var(--mut);}
.rowb{display:flex;justify-content:space-between;align-items:baseline;}
.hint{font-size:12.5px;color:var(--mut);margin-top:16px;}

/* ── 버튼 ── */
.btn{font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--teal);
  border:none;border-radius:10px;padding:15px 30px;cursor:pointer;}
.btn:hover{background:#1B4F4B;}
.btn:disabled{background:var(--line);color:#94A1AB;cursor:not-allowed;}
.btn.sm{padding:12px 22px;font-size:14px;}
.ghost{font-family:inherit;font-size:14px;font-weight:500;color:var(--mut);background:none;
  border:1px solid var(--line);border-radius:9px;padding:11px 18px;cursor:pointer;}
.ghost:hover{color:var(--ink);border-color:var(--mut);}
.ghost.danger{color:#fff;background:var(--plum);border-color:var(--plum);font-weight:700;}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:3px;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;}

/* ── 단계 내비게이션 ── */
.topbar{position:sticky;top:0;z-index:40;background:var(--bg);
  padding:14px 0 10px;margin:0 -18px;padding-left:18px;padding-right:18px;
  border-bottom:1px solid var(--line);}
.topbar-in{max-width:660px;margin:0 auto;}
.steps{display:flex;gap:6px;}
.stepbtn{flex:1;font-family:inherit;font-size:12px;font-weight:700;color:var(--mut);
  background:var(--sf);border:1px solid var(--line);border-radius:9px;
  padding:9px 4px 8px;cursor:pointer;line-height:1.35;text-align:center;}
.stepbtn b{display:block;font-size:15px;font-family:'Noto Serif KR',serif;}
.stepbtn:hover{border-color:var(--mut);color:var(--ink);}
.stepbtn.now{background:var(--teal);border-color:var(--teal);color:#fff;}
.stepbtn.done{border-color:var(--teal);color:var(--teal);}
.goalbar{margin-top:9px;background:var(--tealsoft);border:1px solid #C3DAD6;
  border-radius:9px;padding:9px 13px;font-size:12.5px;line-height:1.7;color:#1B4F4B;}
.goalbar b{font-weight:700;}
.goalbar ol{margin:3px 0 0;padding-left:17px;}
.savebar{margin-top:8px;font-size:11.5px;color:var(--mut);display:flex;
  justify-content:space-between;gap:8px;align-items:center;}
.savebar button{font-family:inherit;font-size:11.5px;color:var(--mut);background:none;
  border:none;border-bottom:1px solid var(--line);padding:0 0 1px;cursor:pointer;}
.savebar button:hover{color:var(--teal);border-color:var(--teal);}

/* ── 검사 화면 ── */
.track{display:flex;gap:3px;margin-bottom:24px;}
.seg{height:5px;flex:1;border-radius:3px;background:var(--line);}
.seg.on{background:var(--teal);}
.q{font-size:clamp(19px,4.6vw,23px);line-height:1.62;margin:16px 0 24px;font-weight:500;}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;
  background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:12px 15px;
  margin-bottom:7px;cursor:pointer;}
.opt:hover{border-color:var(--teal);}
.opt.sel{border-color:var(--teal);background:var(--tealsoft);}
.face{font-size:21px;line-height:1;flex:none;}
.olab{font-size:15px;color:var(--ink);font-weight:500;}
.opt.sel .olab{font-weight:700;}
.osub{font-size:12px;color:var(--mut);margin-top:2px;display:block;}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}

/* ── 결과 화면 ── */
.icon{font-size:56px;line-height:1;}
.tname{font-size:clamp(26px,6.2vw,36px);line-height:1.32;margin:10px 0 6px;}
.tag{font-size:16px;color:var(--ink);margin:0 0 6px;}
.voice{font-size:14px;color:var(--mut);margin:0 0 18px;}
.grow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px;}
.gname{font-size:14.5px;font-weight:700;}
.gdesc{font-size:12.5px;color:var(--mut);font-weight:400;margin-left:6px;}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;}
.fill{height:100%;border-radius:5px;}
.bar.lg{height:24px;border-radius:12px;overflow:visible;position:relative;}
.bar.lg .fill{border-radius:12px;display:flex;align-items:center;justify-content:flex-end;}
.bnum{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.bnum.in{color:#fff;padding-right:11px;}
.bnum.out{position:absolute;top:0;line-height:24px;}
.grow-wrap{margin-bottom:19px;}
.rx{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px;}
.rxh{font-size:14px;font-weight:700;color:var(--amber);margin-bottom:2px;}
.rxt{font-size:15px;font-weight:700;margin-bottom:12px;}
.rxpick{display:block;width:100%;text-align:left;font-family:inherit;font-size:14.5px;
  line-height:1.8;color:var(--ink);background:var(--sf);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px 11px 40px;margin-bottom:7px;cursor:pointer;position:relative;}
.rxpick:hover{border-color:var(--teal);}
.rxpick::before{content:"";position:absolute;left:14px;top:14px;width:15px;height:15px;
  border:1.5px solid var(--line);border-radius:4px;background:var(--sf);}
.rxpick.sel{border-color:var(--teal);background:var(--tealsoft);font-weight:500;}
.rxpick.sel::before{background:var(--teal);border-color:var(--teal);}
.rxpick.sel::after{content:"";position:absolute;left:18px;top:18px;width:7px;height:4px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);}
.rxpick:disabled{opacity:.45;cursor:not-allowed;}

/* ── 입력 ── */
.plan,.ta{width:100%;font-family:inherit;font-size:14.5px;line-height:1.8;color:var(--ink);
  background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:14px;
  resize:vertical;min-height:92px;}
.ta.sm{min-height:62px;font-size:14px;padding:11px 13px;}
.plan::placeholder,.ta::placeholder,.inp::placeholder{color:#A4AFB7;}
.inp{width:100%;font-family:inherit;font-size:14.5px;
  padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink);}
label.fl{display:block;font-size:13.5px;font-weight:700;margin:16px 0 7px;}
label.fl span{font-weight:400;color:var(--mut);margin-left:6px;font-size:12.5px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px;}
.chip{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--sf);
  border:1px solid var(--line);border-radius:20px;padding:8px 15px;cursor:pointer;}
.chip:hover{border-color:var(--teal);}
.chip.sel{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}
.chip.am.sel{background:var(--amber);border-color:var(--amber);}
.chip.pl.sel{background:var(--plum);border-color:var(--plum);}
.grade{display:flex;gap:6px;}
.grade button{flex:1;font-family:inherit;font-size:13.5px;background:var(--sf);
  border:1px solid var(--line);border-radius:9px;padding:10px 4px;cursor:pointer;color:var(--ink);}
.grade button.sel{background:var(--amber);border-color:var(--amber);color:#fff;font-weight:700;}

/* ── 단계 패널 (전/중/후) ── */
.panel{background:var(--sf);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;margin-bottom:14px;border-left:5px solid var(--line);}
.panel.pre{border-left-color:var(--teal);}
.panel.dur{border-left-color:var(--amber);}
.panel.post{border-left-color:var(--plum);}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.ph h3{font-size:18px;margin:0;font-family:'Noto Serif KR',serif;font-weight:700;}
.when{font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 11px;white-space:nowrap;}
.when.a{background:var(--tealsoft);color:#1B4F4B;}
.when.b{background:var(--ambersoft);color:#8A6008;}
.when.c{background:var(--plumsoft);color:#6B3A5E;}
.plede{font-size:13.5px;line-height:1.85;color:var(--mut);margin:9px 0 4px;}
.tip{background:var(--tealsoft);border-radius:9px;padding:11px 14px;font-size:13px;
  line-height:1.8;color:#1B4F4B;margin:10px 0 0;}
.tip.am{background:var(--ambersoft);color:#7A5507;}
.sub3{border-top:1px solid var(--line);margin-top:22px;padding-top:6px;}

/* ── 3P ── */
.pcol{font-family:'Noto Serif KR',serif;font-weight:700;font-size:13px;
  color:var(--teal);letter-spacing:.04em;}

/* ── 대본 / 키워드 ── */
.meter{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:13px;color:var(--mut);}
.meter b{font-size:20px;font-family:'Noto Serif KR',serif;color:var(--ink);font-variant-numeric:tabular-nums;}
.gauge{height:7px;background:var(--line);border-radius:4px;margin-top:9px;position:relative;overflow:hidden;}
.gauge i{display:block;height:100%;border-radius:4px;background:var(--teal);}
.gauge.lo i{background:var(--line);}
.gauge.hi i{background:var(--plum);}
.kwrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;}
.kwcard{flex:1 1 150px;background:var(--sf);border:1px solid var(--line);
  border-radius:12px;padding:14px 15px;}
.kwn{font-size:11.5px;font-weight:700;color:var(--amber);}
.kwv{font-family:'Noto Serif KR',serif;font-weight:700;font-size:21px;margin-top:3px;
  word-break:keep-all;line-height:1.35;}
.kwe{width:100%;font-family:'Noto Serif KR',serif;font-weight:700;font-size:19px;
  border:none;border-bottom:1.5px solid var(--line);background:none;color:var(--ink);
  padding:2px 0 4px;margin-top:3px;}
.kwe:focus{outline:none;border-color:var(--teal);}

/* ── 슬라이드 ── */
#deck{position:fixed;inset:0;z-index:100;background:#0E1A22;color:#fff;
  display:flex;flex-direction:column;}
#deck.off{display:none;}
.dstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px 24px;cursor:pointer;}
.dnum{font-size:14px;letter-spacing:.3em;color:#7E93A0;margin-bottom:22px;}
.dkw{font-family:'Noto Serif KR',serif;font-weight:700;
  font-size:clamp(46px,15vw,124px);line-height:1.12;word-break:keep-all;}
.dtitle{font-family:'Noto Serif KR',serif;font-weight:700;
  font-size:clamp(28px,7vw,56px);line-height:1.3;word-break:keep-all;}
.dwho{font-size:16px;color:#9FB2BD;margin-top:20px;}
.dfoot{border-top:1px solid #23343F;padding:13px 20px calc(13px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
.dcues{font-size:13.5px;color:#C9D6DE;line-height:1.6;}
.dcues span{color:var(--amber);font-weight:700;}
.dtime{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;color:#8FB3AE;}
.dtime.warn{color:var(--amber);}
.dtime.over{color:#E08C9E;}
.dx{font-family:inherit;font-size:13px;color:#9FB2BD;background:none;
  border:1px solid #2C3F4B;border-radius:8px;padding:8px 14px;cursor:pointer;}
.dx:hover{color:#fff;border-color:#4A6070;}
.ddots{display:flex;gap:6px;}
.ddots i{width:7px;height:7px;border-radius:50%;background:#2C3F4B;display:block;}
.ddots i.on{background:var(--amber);}

/* ── 말하기 계획 카드 (패들렛에 올릴 한 장) ── */
#pcard{position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 14px calc(8px + env(safe-area-inset-bottom));}
#pcard.off{display:none;}
/* 캡처해서 패들렛에 올리는 그림이므로, 화면을 넉넉히 채워야
   썸네일에서 여백만 보이지 않는다. 넘치지는 않게 vh로 묶어 둔다. */
.pc{width:100%;max-width:min(620px,100%);min-height:min(560px,80vh);
  display:flex;flex-direction:column;
  background:var(--sf);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(21,34,45,.10);}
.pc-head{background:var(--teal);color:#fff;padding:13px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;}
.pc-who{font-size:14px;font-weight:700;}
.pc-type{font-size:12.5px;color:#BBD8D3;white-space:nowrap;}
.pc-type b{color:#fff;font-weight:700;}
.pc-body{padding:17px 18px 19px;flex:1;display:flex;flex-direction:column;}
.pc-topic{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:700;
  font-size:clamp(21px,5.6vw,27px);line-height:1.34;word-break:keep-all;}
.pc-why{font-size:12.5px;line-height:1.72;color:var(--mut);margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pc-goal{margin-top:13px;background:var(--tealsoft);border:1px solid #C3DAD6;
  border-radius:11px;padding:11px 14px;}
.pc-goal .lab{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.04em;}
.pc-goal .txt{font-size:14.5px;line-height:1.62;color:#15303A;margin-top:3px;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.pc-rows{margin-top:14px;border-top:1px solid var(--line);}
.pc-row{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
/* 남는 세로 공간은 여기 한 곳으로 모은다 (줄 사이가 벌어지지 않도록) */
.pc-gap{flex:1;min-height:10px;}
.pc-key{flex:none;width:52px;font-size:11px;font-weight:700;color:var(--teal);
  letter-spacing:.03em;padding-top:2px;}
.pc-val{flex:1;font-size:13px;line-height:1.66;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pc-val em{font-style:normal;color:var(--mut);}
.pc-val .none{color:#A4AFB7;}
.pc-hook{margin-top:13px;font-family:'Noto Serif KR',serif;font-weight:700;
  font-size:14.5px;line-height:1.6;color:var(--ink);
  border-left:3px solid var(--amber);padding-left:11px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pc-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;
  gap:10px;font-size:11.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px;}
.pc-nerve{white-space:nowrap;}
.pc-nerve b{color:var(--plum);font-size:13px;}
.pcbar{margin-top:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  justify-content:center;font-size:12px;color:var(--mut);}
.pcbar button{font-family:inherit;font-size:12.5px;color:var(--mut);background:var(--sf);
  border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;}
.pcbar button:hover{color:var(--ink);border-color:var(--mut);}
.pcseg{display:flex;gap:0;}
.pcseg button{border-radius:0;margin-left:-1px;}
.pcseg button:first-child{border-radius:8px 0 0 8px;margin-left:0;}
.pcseg button:last-child{border-radius:0 8px 8px 0;}
.pcseg button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}
.pcseg button.on:hover{color:#fff;border-color:var(--teal);}

/* ── 청중용 : 어디를 보고 들어야 하는지만 ── */
.pc-aud{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:26px 26px 24px;text-align:center;}
.pc-aud-label{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.06em;}
.pc-aud-topic{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:700;
  font-size:clamp(25px,6.6vw,34px);line-height:1.32;word-break:keep-all;margin-top:7px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.pc-aud-goal{margin-top:26px;background:var(--tealsoft);border:1px solid #C3DAD6;
  border-radius:14px;padding:19px 20px;}
.pc-aud-goal .lab{font-size:11.5px;font-weight:700;color:var(--teal);letter-spacing:.05em;}
.pc-aud-goal .txt{font-family:'Noto Serif KR','Nanum Myeongjo',serif;font-weight:700;
  font-size:clamp(17px,4.4vw,22px);line-height:1.58;color:#15303A;margin-top:8px;
  word-break:keep-all;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}
.pc-aud-ask{margin-top:22px;font-size:13px;line-height:1.75;color:var(--mut);}
.pc-aud-ask b{color:var(--ink);}

/* ── 주제가 안 떠오를 때 ── */
.seedbtn{font-family:inherit;font-size:12.5px;color:var(--mut);background:var(--sf);
  border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;margin-top:8px;}
.seedbtn:hover{color:var(--teal);border-color:var(--teal);}
.seedbox{margin-top:10px;background:var(--sf);border:1px dashed #BFC9D1;
  border-radius:11px;padding:14px 15px;}
.seedbox p{font-size:12.5px;color:var(--mut);margin:0 0 10px;line-height:1.7;}

/* ── 구상 타이머 ── */
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:var(--sf);border:1px solid var(--line);border-radius:11px;
  padding:10px 13px;margin-top:16px;}
.tclock{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--ink);min-width:84px;}
.tclock.warn{color:var(--amber);} .tclock.over{color:var(--plum);}
.tbar button{font-family:inherit;font-size:12.5px;color:var(--mut);background:var(--sf);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;}
.tbar button:hover{color:var(--ink);border-color:var(--mut);}
.tbar button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700;}
.tbar .tsp{flex:1;min-width:0;}
.tbar .tnote{font-size:12px;color:var(--mut);}

/* =================== 채점 =================== */
function sc(it,raw){ return it.rev ? 6-raw : raw; }
function pct(arr){
  if(!arr.length) return 0;
  var s=0,i; for(i=0;i<arr.length;i++) s+=arr[i];
  return Math.round(((s-arr.length)/(arr.length*4))*100);
}
function computeScores(ans){
  var by={anx:[],prep:[],reg:[],lis:[]}, ph={pre:[],during:[],post:[]}, i;
  for(i=0;i<ITEMS.length;i++){
    var it=ITEMS[i], v=sc(it,ans[it.id]);
    by[it.dim].push(v);
    if(it.phase) ph[it.phase].push(v);
  }
  return {anx:pct(by.anx),prep:pct(by.prep),reg:pct(by.reg),lis:pct(by.lis),
          pre:pct(ph.pre),during:pct(ph.during),post:pct(ph.post)};
}
function uniformAnswer(ans){
  var vals=ITEMS.map(function(it){return ans[it.id];}),i;
  for(i=1;i<vals.length;i++) if(vals[i]!==vals[0]) return false;
  return true;
}
function abilityOf(s){ return Math.round((s.prep+s.reg+s.lis)/3); }
function decideType(s){
  var ab=abilityOf(s);
  if(s.anx<50) return {key:ab>=50?"dolphin":"lion",ability:ab};
  if(ab>=55) return {key:"hamster",ability:ab};
  if(ab<38) return {key:"chick",ability:ab};
  if(s.prep>=s.reg && s.prep>=s.lis) return {key:"turtle",ability:ab};
  if(s.reg>=s.lis) return {key:"owl",ability:ab};
  return {key:"rabbit",ability:ab};
}
function buildPrescription(s){
  var b=[],d=[],a=[];
  b.push(s.prep<55?"주제와 목적, 듣는 사람이 누구인지 한 줄로 적고 시작하기"
                  :"준비한 내용을 핵심어 세 개로 줄여 카드에 적기");
  b.push(s.prep<55?"도입-전개-정리 세 칸을 그려 놓고 한 칸씩 채우기"
                  :"듣는 사람의 흥미를 끌 예나 이야기를 하나 더 넣기");
  if(s.pre>=50) b.push("첫 15초에 할 말만 통째로 정해 두기 (시작이 안정되면 나머지는 따라옵니다)");
  b.push(s.prep<55?"타이머를 켜고 소리 내어 한 번 연습하기"
                  :"연습을 녹음해 듣고 말이 빨라지는 구간 한 곳만 고치기");
  if(s.pre>=60) b.push("발표 직전 4초 들이마시고 6초 내쉬기 × 3회");

  if(s.during>=50) d.push("숨을 내쉬면서 첫 문장을 시작하기");
  d.push(s.during>=50?"나를 편하게 봐 주는 친구 한 명 → 두 명 → 전체로 시선 넓히기"
                     :"한 문단마다 시선을 다른 쪽으로 옮기기");
  d.push(s.reg<55?"내용을 잊으면 핵심어부터 다시 말하기 (침묵보다 되짚기가 낫습니다)"
                 :"말이 막힐 때 쓸 연결 표현 하나 준비하기 — “다시 정리하면”");
  d.push(s.reg<55?"듣는 사람이 갸웃하면 속도를 늦추고 예를 하나 더 들기"
                 :"중요한 문장 앞에서 한 박자 쉬어 강조하기");
  if(s.reg<45) d.push("한 문장씩 끝까지 말하고 쉬기 (문장을 이어 붙일수록 숨이 가빠집니다)");

  a.push("잘된 점 한 가지 적기");
  a.push("어려웠던 점 한 가지 적기");
  a.push("다음에 바꿀 점 한 가지를 행동으로 적기");
  if(s.post>=55) a.push("아쉬운 점은 한 개당 다음에 할 행동 한 개로 바꿔 적기 — “목소리가 작았다”가 아니라 “뒷자리까지 들리게 말한다”");
  if(s.post>=55) a.push("친구에게 “어땠어?” 대신 “어느 부분이 이해 안 됐어?”라고 묻기");
  a.push(s.lis<55?"친구의 발표에서 좋았던 점 한 가지를 구체적으로 말해 주기"
                 :"친구의 발표를 들으며 내 발표에 쓸 만한 방법 하나 메모하기");
  if(s.lis<50) a.push("받은 피드백을 전부 고치려 하지 말고, 내 목표에 맞는 하나만 골라 다음 발표에 반영하기");
  if(s.lis<40) a.push("들을 때 딴생각이 들면 스스로 알아차리고 되돌아오기 (듣기도 점검이 필요합니다)");
  return {before:b,during:d,after:a};
}

/* =================== 구상 타이머 =================== */
var TIMER = {sec:0, total:0, run:false, full:false, cmin:9, csec:0};
var timerTick = null;
function tfmt(s){
  if(s<0) s=0;
  var m=Math.floor(s/60), x=s%60;
  return m+":"+(x<10?"0":"")+x;
}
function tstate(){
  /* 아직 맞추지 않은 0:00은 '끝남'이 아니므로 경고색을 쓰지 않는다 */
  if(TIMER.total<=0) return "";
  return TIMER.sec<=0 ? "over" : (TIMER.sec<=60 ? "warn" : "");
}
function timerStop(){ if(timerTick){ clearInterval(timerTick); timerTick=null; } }
function timerSet(min){
  timerSetSec(min*60);
  TIMER.cmin = min; TIMER.csec = 0;
  paintTimer();
}
/* 직접 입력한 시간을 적용한다. 되돌리기와 다시 시작의 기준도 이 값이 된다. */
function timerSetSec(sec){
  timerStop();
  TIMER.total = sec; TIMER.sec = sec; TIMER.run = false;
}
function timerApplyCustom(){
  var m = document.getElementById("tcm"), x = document.getElementById("tcs");
  var mm = m ? parseInt(m.value,10) : 0, ss = x ? parseInt(x.value,10) : 0;
  if(isNaN(mm)||mm<0) mm=0;
  if(isNaN(ss)||ss<0) ss=0;
  if(ss>59) ss=59;
  if(mm>99) mm=99;
  var tot = mm*60+ss;
  if(tot<=0){ toast("1초 이상으로 맞춰 주세요"); return; }
  TIMER.cmin = mm; TIMER.csec = ss;
  timerSetSec(tot);
  paintTimer();
  toast("타이머를 " + tfmt(tot) + "로 맞췄습니다");
}
function timerToggle(){
  if(TIMER.total<=0) return;
  if(TIMER.sec<=0){ TIMER.sec = TIMER.total; }
  TIMER.run = !TIMER.run;
  timerStop();
  if(TIMER.run){
    timerTick = setInterval(function(){
      TIMER.sec--;
      if(TIMER.sec<=0){ TIMER.sec=0; TIMER.run=false; timerStop(); paintTimer(); return; }
      paintClock();
    }, 1000);
  }
  paintTimer();
}
function timerReset(){ timerStop(); TIMER.run=false; TIMER.sec=TIMER.total; paintTimer(); }
function paintClock(){
  var a=document.getElementById("tclock");
  if(a){ a.textContent=tfmt(TIMER.sec); a.className="tclock "+tstate(); }
  var b=document.getElementById("tbig");
  if(b){ b.textContent=tfmt(TIMER.sec); b.className="tbig "+tstate(); }
}
function timerBarHTML(){
  var mins=[3,5,9,10], h='<div class="tbar">', i;
  h += '<span class="tclock '+tstate()+'" id="tclock">'+tfmt(TIMER.sec)+'</span>';
  h += '<button id="tgo">'+(TIMER.run?"멈춤":"시작")+'</button>'+
       '<button id="treset">되돌리기</button>'+
       '<span class="tsp"></span>'+
       '<button id="tbigbtn">크게 보기</button>';
  for(i=0;i<mins.length;i++)
    h += '<button data-tmin="'+mins[i]+'" class="'+(TIMER.total===mins[i]*60?"on":"")+'">'+mins[i]+'분</button>';
  h += '<span class="tdiv"></span>'+
       '<span class="tcust">'+
       '<input type="number" id="tcm" min="0" max="99" inputmode="numeric" value="'+TIMER.cmin+'" aria-label="분">분'+
       '<input type="number" id="tcs" min="0" max="59" step="5" inputmode="numeric" value="'+TIMER.csec+'" aria-label="초">초'+
       '<button id="tset">맞춤</button></span>';
  h += '</div>'+
       '<p class="hint" style="margin-top:7px">버튼으로 고르거나 <b>분·초를 직접 입력</b>해 맞출 수 있습니다. 선생님 화면에서 <b>크게 보기</b>로 띄워 두면 반 전체가 같은 시간을 봅니다.</p>';
  return h;
}
function paintTimer(){
  var bar=document.getElementById("timerzone");
  if(bar) bar.innerHTML = timerBarHTML();
  bindTimer();
  paintFullTimer();
}
function paintFullTimer(){
  var f=document.getElementById("tfull");
  if(!TIMER.full){ f.className="off"; f.innerHTML=""; return; }
  f.className="";
  f.innerHTML = '<div class="tbig '+tstate()+'" id="tbig">'+tfmt(TIMER.sec)+'</div>'+
    '<div class="tlab">'+(TIMER.sec<=0 ? '시간이 끝났습니다' : '말하기 계획 세우기')+'</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">'+
    '<button class="dx" id="tfgo">'+(TIMER.run?"멈춤":"시작")+'</button>'+
    '<button class="dx" id="tfclose">닫기 (ESC)</button></div>';
  document.getElementById("tfgo").addEventListener("click", timerToggle);
  document.getElementById("tfclose").addEventListener("click", function(){
    TIMER.full=false; paintFullTimer();
  });
}
function bindTimer(){
  var el;
  document.querySelectorAll("[data-tmin]").forEach(function(b){
    b.addEventListener("click", function(){ timerSet(+this.getAttribute("data-tmin")); });
  });
  el=document.getElementById("tgo");     if(el) el.addEventListener("click", timerToggle);
  el=document.getElementById("treset");  if(el) el.addEventListener("click", timerReset);
  el=document.getElementById("tset");    if(el) el.addEventListener("click", timerApplyCustom);
  ["tcm","tcs"].forEach(function(id){
    var n=document.getElementById(id);
    if(!n) return;
    n.addEventListener("keydown", function(e){
      if(e.key==="Enter"){ e.preventDefault(); timerApplyCustom(); }
    });
    n.addEventListener("focus", function(){ this.select(); });
  });
  el=document.getElementById("tbigbtn"); if(el) el.addEventListener("click", function(){
    TIMER.full=true; paintFullTimer();
  });
}

/* 한 번만 잘라 낸다. 가장 긴 조사가 걸렸는데 남는 몸통이 한 글자뿐이면
   ('날이라는' -> '날') 낱말로 쓰지 않고 버린다. 빈 문자열이 그 신호다. */
function stripJosa(w){
  var i;
  for(i=0;i<JOSA.length;i++){
    var s=JOSA[i];
    if(w.length>s.length && w.slice(-s.length)===s){
      var rest = w.slice(0, w.length-s.length);
      return rest.length>=2 ? rest : "";
    }
  }
  return w;
}
/* '다'로 끝나는 흔한 명사는 서술어로 보지 않는다 */
var NOUN_DA = {"바다":1,"소다":1,"사이다":1,"기타":0};
function looksPredicate(w){
  var i;
  if(NOUN_DA[w]) return false;
  for(i=0;i<PRED_TAIL.length;i++){
    var t=PRED_TAIL[i];
    if(w.length>t.length && w.slice(-t.length)===t) return true;
  }
  return false;
}

  var stat = {}, si, wi;
  for(si=0; si<sents.length; si++){
    var words = sents[si].split(/\s+/);
    for(wi=0; wi<words.length; wi++){
      var raw = cleanToken(words[wi]);
      if(!raw) continue;
      if(looksPredicate(raw)) continue;
      var w = stripJosa(raw);
      if(w.length<2) continue;
      if(/^[0-9]+$/.test(w)) continue;
      if(STOPSET[w]) continue;
      if(!stat[w]) stat[w] = {w:w, n:0, sents:{}, first:si};
      stat[w].n++;
      stat[w].sents[si] = 1;
      if(si < stat[w].first) stat[w].first = si;
    }
  }
  var last = sents.length-1, arr = [], k;
  for(k in stat){ if(stat.hasOwnProperty(k)) arr.push(stat[k]); }
  for(wi=0; wi<arr.length; wi++){
    var e = arr[wi], spread = 0, s2;
    for(s2 in e.sents) if(e.sents.hasOwnProperty(s2)) spread++;
    e.score = e.n
      + spread * 0.6
      + (e.w.length>2 ? (e.w.length-2)*0.35 : 0)
      + (e.sents[0] ? 1.2 : 0)
      + (e.sents[last] && last>0 ? 0.8 : 0);
  }
  arr.sort(function(a,b){ return b.score-a.score || a.first-b.first; });
  /* 포함 관계가 있으면 긴 쪽만 남긴다 */
  var out = [];
  for(wi=0; wi<arr.length; wi++){
    var cand = arr[wi].w, dup = false, oi;
    for(oi=0; oi<out.length; oi++){
      if(out[oi].indexOf(cand)>=0 || cand.indexOf(out[oi])>=0){ dup = true; break; }
    }
    if(!dup) out.push(cand);
    if(out.length>=want) break;
  }
  return out;
}
var CPM = 280; /* 중학생 발표 기준 : 공백을 뺀 분당 280자 (1분 약 280자, 3분 약 840자) */
function speakSeconds(text){
  var n = (text||"").replace(/\s/g,"").length;
  return Math.round(n / CPM * 60);
}
function mmss(sec){
  var m = Math.floor(sec/60), s = sec%60;
  return m + ":" + (s<10?"0":"") + s;
}

var MEMSTORE = {}, STORAGE_OK = null;
function storeSet(k,v){
  try{ localStorage.setItem(k,v); STORAGE_OK = true; }
  catch(e){ MEMSTORE[k]=v; STORAGE_OK = false; }
}
function storeGet(k){
  try{ var v = localStorage.getItem(k); STORAGE_OK = true; return v; }
  catch(e){ STORAGE_OK = false; return MEMSTORE.hasOwnProperty(k) ? MEMSTORE[k] : null; }
}

function healState(f){
  var d = freshState();
  if(!f.pre) f.pre = d.pre;
  if(!f.cue) f.cue = d.cue;
  if(!f.post) f.post = d.post;
  if(!f.talk) f.talk = d.talk;
  if(!f.fb) f.fb = d.fb;
  if(!f.pre.anxSigns || typeof f.pre.anxSigns!=="object") f.pre.anxSigns = {};
  if(!f.pre.place || typeof f.pre.place!=="object") f.pre.place = {};
  if(!Array.isArray(f.goals)) f.goals = [];
  if(!Array.isArray(f.talk.keywords)) f.talk.keywords = ["","",""];
  while(f.talk.keywords.length<3) f.talk.keywords.push("");
  if(!Array.isArray(f.fb.given)) f.fb.given = [];
  if(!f.fb.draft) f.fb.draft = {name:"",goal:"",mark:"",why:"",good:"",next:""};
  if(!f.fb.mode) f.fb.mode = "audience";
  f.deck = {on:false,i:0,showCues:true,t0:0,sec:0};
  f.pcard = {on:false, mode:(f.pcard && f.pcard.mode) || "audience"};
  if(!f.ui || typeof f.ui!=="object") f.ui = {seeds:false, confirmNew:false};
  f.ui.confirmNew = false;
  return f;
}

/* =================== 파일 저장 =================== */
/* 링크로 여는 경우와 파일로 여는 경우가 저장 방식이 다르다.
   링크(아티팩트)에서는 내려받기 권한을 통해야 하고, 파일에서는 보통 방식이 된다. */
var DL = null;
try{
  if(window.claude && typeof claude.use === "function"){
    claude.use("downloads").then(function(d){ DL = d; }, function(){});
  }
}catch(e){}
function saveFile(filename, text, mime){
  if(DL && DL.save){
    DL.save({filename:filename, data:text}).then(function(){
      toast("저장했습니다 — " + filename);
    }, function(err){
      toast((err && err.code==="declined") ? "저장을 취소했습니다" : "저장할 수 없습니다 — 인쇄를 이용하세요");
    });
    return;
  }
  try{
    var blob = new Blob([text], {type:mime});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 800);
    toast("내려받았습니다 — " + filename);
  }catch(e){ toast("저장할 수 없습니다 — 인쇄를 이용하세요"); }
}
/* 파일 이름은 영문·숫자로만 짓는다. 크로미움은 내려받기 이름에 한글이 섞이면
   이름을 통째로 버리고 'download'로 바꾸는데, 그러면 24명의 파일이 전부
   download(1), download(2)…가 되어 다음 시간에 자기 것을 찾지 못한다. */
function stamp(){
  var d=new Date(), z=function(n){ return (n<10?"0":"")+n; };
  return z(d.getMonth()+1)+z(d.getDate())+"-"+z(d.getHours())+z(d.getMinutes());
}
function workFilename(){
  var sid = (S.sid||"").replace(/[^0-9A-Za-z]/g,"");
  return "ilji_" + (sid?sid+"_":"") + stamp() + ".json";
}
function downloadWork(){
  saveFile(workFilename(), JSON.stringify(S,null,2), "application/json");
}
function uploadWork(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(r.result), fs = freshState(), k;
      for(k in fs) if(fs.hasOwnProperty(k) && o.hasOwnProperty(k)) fs[k]=o[k];
      S = healState(fs); save(); render(); toast("불러왔습니다");
    }catch(err){ toast("파일을 읽을 수 없습니다"); }
  };
  r.readAsText(f);
  e.target.value = "";
}

function curveSVG(pre,during,post){

      '<p class="body" style="margin:6px 0 10px;font-size:13.5px">고른 처방 &mdash; '+esc(g.text)+'</p>'+

      '<textarea class="ta sm" id="ref0" data-ref="0" placeholder="예) 이번 말하기에서 한 문단마다 고개를 들어 친구들을 세 번 이상 본다.">'+esc(g.refined)+'</textarea>'+
      '</div>';
  } else {
    goalCards = '<div class="empty">위 처방전에서 <b>하나</b>를 눌러 고르면 여기에 목표 칸이 생깁니다.<br>여러 개를 고르면 하나도 못 지킵니다. 이번 말하기에서는 딱 하나만 노립니다.</div>';
  }

  return '<div class="fade">'+
  (S.flat?'<p class="warn">스무 문항에 모두 같은 번호로 답했습니다. 문항 중에는 <strong>반대로 물어보는 것</strong>도 섞여 있어서, 이대로는 결과가 실제 나와 다를 수 있습니다. 시간이 되면 다시 한번 천천히 해 보세요.</p>':'')+
  '<div class="phase">1단계 &middot; 검사 결과</div>'+
  '<div class="icon" aria-hidden="true">'+T.icon+'</div>'+
  '<h2 class="sf tname">'+T.name+'</h2>'+
  '<p class="tag">'+T.tagline+'</p>'+
  '<p class="voice">'+T.voice+'</p>'+
  '<p class="body">'+T.read+'</p>'+

  '<h3 class="sf h">나의 발표 성향 분석표</h3>'+bars+
  '<p class="body" style="font-size:13.5px">불안도만 높다고 발표를 못하는 것이 아닙니다. 네 영역을 나누어 보는 이유는, 같은 불안도라도 준비력과 조절력에 따라 결과가 크게 달라지기 때문입니다. 지금 나의 가장 든든한 힘은 <strong>'+DIM[strong].name+'</strong>이고, 가장 얇은 쪽은 <strong>'+DIM[weak].name+'</strong>입니다.</p>'+

  '<h3 class="sf h">나의 긴장 곡선</h3>'+
  '<div class="card">'+curveSVG(s.pre,s.during,s.post)+
  '<p class="body" style="margin-top:10px;font-size:13.5px">점선은 중간 지점입니다. 세 구간 중 <strong>'+peak.k+'</strong>에서 긴장이 가장 높게 나왔습니다. 발표 전체를 통째로 고치려 하기보다 이 구간부터 다루는 편이 효율적입니다.</p></div>'+

  '<h3 class="sf h">💊 나의 발표 처방전</h3>'+
  '<p class="body" style="margin-bottom:14px">점수에 맞춰 뽑은 것이라 사람마다 내용이 다릅니다. 이 가운데 <strong>이번 말하기에서 꼭 지킬 것 하나</strong>를 눌러 고르세요. 고른 것이 나의 발표 목표가 됩니다. 다른 것을 누르면 그것으로 바뀝니다.</p>'+
  block("BEFORE","발표 전",rx.before,"발표 전")+
  block("DURING","발표 중",rx.during,"발표 중")+
  block("AFTER","발표 후",rx.after,"발표 후")+

  '<h3 class="sf h">나만의 발표 목표</h3>'+
  '<p class="body" style="margin-bottom:12px">목표는 하나만 세웁니다. 여러 개를 노리면 발표 중에 아무것도 떠오르지 않습니다. “긴장하지 말자”처럼 마음가짐을 적으면 지켰는지 확인할 수 없으니, <strong>친구들이 보고 판단할 수 있는 행동</strong>으로 적으세요. 그래야 4단계에서 목표가 이루어졌는지 함께 점검할 수 있습니다.</p>'+
  goalCards+

  (s.anx>78?'<p class="note">긴장이 상당히 높게 나왔습니다. 혼자 견디는 것보다 선생님이나 믿을 만한 어른에게 이야기해 두면 발표 순서나 방식을 조정해 볼 수 있습니다. 도움을 요청하는 것도 조절력의 하나입니다.</p>':'')+

  '<h3 class="sf h">지금 나에게 필요한 것</h3><p class="body">'+T.next+'</p>'+

  '<h3 class="sf h">학번과 이름</h3>'+
  '<div class="card"><p class="body" style="font-size:13.5px;margin:0 0 12px">일지를 내거나 인쇄할 때 쓰입니다.</p>'+
  '<input class="inp" id="sid" placeholder="학번 (예: 20301)" aria-label="학번" style="margin-bottom:8px" value="'+esc(S.sid)+'">'+
  '<input class="inp" id="sname" placeholder="이름" aria-label="이름" value="'+esc(S.sname)+'"></div>'+

  '<div class="btnrow">'+
  '<button class="btn" id="toPlan"'+(S.goals.length?"":" disabled")+'>2단계로 &mdash; 말하기 계획 세우기</button>'+
  '<button class="ghost" id="again">검사 다시 하기</button></div>'+
  (S.goals.length?'':'<p class="hint">처방전에서 목표를 한 개 이상 골라야 다음 단계로 넘어갈 수 있습니다.</p>')+
  '</div>';
}

/* =================== 2단계 : 말하기 전 / 중 / 후 =================== */
function chipRow(list,cur,attr,cls){
  var h='<div class="chips">',i;
  for(i=0;i<list.length;i++){
    var o = typeof list[i]==="string" ? {k:list[i],label:list[i]} : list[i];
    h+='<button class="chip'+(cls?(" "+cls):"")+(cur===o.k?" sel":"")+'" '+attr+'="'+esc(o.k)+'">'+esc(o.label)+'</button>';
  }
  return h+'</div>';
}
var GRADES = ["잘 지켰다","반쯤 지켰다","못 지켰다"];
function gradeRow(cur,attr){
  var h='<div class="grade">',i;
  for(i=0;i<GRADES.length;i++)
    h+='<button class="'+(cur===GRADES[i]?"sel":"")+'" '+attr+'="'+GRADES[i]+'">'+GRADES[i]+'</button>';
  return h+'</div>';
}
function viewPlan(){
  var s=S.scores, p=S.pre;
  var peakLine = "";
  if(s){
    var ph=[{k:"발표 전",v:s.pre},{k:"발표 중",v:s.during},{k:"발표 후",v:s.post}],i;
    var peak=ph[0]; for(i=1;i<3;i++) if(ph[i].v>peak.v) peak=ph[i];
    peakLine = '<p class="tip">검사에서 <b>'+peak.k+'</b> 긴장이 가장 높게 나왔습니다('+peak.v+'점). 아래 칸을 채울 때 이 구간을 특히 신경 써 보세요.</p>';
  }
  var signs="",i2;
  for(i2=0;i2<ANXSIGN.length;i2++){
    var sg=ANXSIGN[i2];
    signs+='<button class="chip pl'+(p.anxSigns[sg]?" sel":"")+'" data-sign="'+esc(sg)+'">'+esc(sg)+'</button>';
  }
  var placeOpts=["교실 앞에 서서","학급 전체 앞에서","화면을 함께 보며","마이크 없이","자리에 앉은 채로","1~3분 안에"];
  var places="",i3;
  for(i3=0;i3<placeOpts.length;i3++){
    var pl=placeOpts[i3];
    places+='<button class="chip'+(p.place[pl]?" sel":"")+'" data-place="'+esc(pl)+'">'+esc(pl)+'</button>';
  }
  var seeds="",i4;
  for(i4=0;i4<SEEDS.length;i4++)
    seeds += '<button class="chip" data-seed="'+esc(SEEDS[i4])+'">'+esc(SEEDS[i4])+'</button>';
  return '<div class="fade">'+
  '<div class="phase">2단계</div>'+
  '<h2 class="sf" style="font-size:clamp(24px,5.6vw,32px);margin:6px 0 8px">1~3분 말하기 계획 세우기</h2>'+
  '<p class="lede" style="margin-bottom:6px">친구들에게 말하고 싶은 <strong style="color:#15222D">나의 경험</strong>을 하나 골라, 말하기 전에 점검할 것을 채웁니다. 말하는 중에 점검할 것은 3단계에서, 말하기를 마친 뒤의 성찰은 4단계에서 이어집니다.</p>'+
  peakLine+
  '<div id="timerzone">'+timerBarHTML()+'</div>'+

  /* ── 말하기 전 ── */
  '<div class="panel pre" style="margin-top:22px">'+
  '<div class="ph"><h3>말하기 전</h3><span class="when a">발표 전에 작성</span></div>'+
  '<p class="plede">무엇을, 누구에게, 어떤 자리에서 말하는지 먼저 정해 둡니다. 이것을 정하지 않으면 대본이 길어지기만 합니다.</p>'+

  '<label class="fl" for="topic">말하고 싶은 경험<span>한 가지만</span></label>'+
  '<input class="inp" id="topic" data-f="pre.topic" placeholder="예) 처음으로 김장을 도운 날" value="'+esc(p.topic)+'">'+
  (S.ui.seeds
    ? '<div class="seedbox"><p>마음에 드는 것을 눌러 보세요. 그대로 쓰는 것이 아니라 <b>내 이야기로 고쳐 쓰는 출발점</b>입니다.</p><div class="chips">'+seeds+'</div>'+
      '<button class="seedbtn" id="seedClose" style="margin-top:4px">닫기</button></div>'
    : '<button class="seedbtn" id="seedOpen">주제가 안 떠올라요</button>')+
  '<label class="fl" for="why">이 경험을 고른 까닭</label>'+
  '<textarea class="ta sm" id="why" data-f="pre.why" placeholder="예) 힘들었지만 그날 이후로 가족을 보는 눈이 달라졌기 때문이다.">'+esc(p.why)+'</textarea>'+

  '<div class="sub3"><h4 class="h"><span class="pcol">3P</span> 말하기 상황 분석</h4>'+

  '<label class="fl"><span class="pcol">PURPOSE</span> &nbsp;이 말하기의 목적</label>'+
  chipRow(PURPOSE,p.purpose,"data-purpose")+
  (p.purpose?'<p class="body" style="font-size:13px;margin:4px 0 0">'+
    esc((PURPOSE.filter(function(x){return x.k===p.purpose;})[0]||{}).hint||"")+'</p>':'')+
  '<label class="fl" for="purposeLine">한 줄로 풀어 쓰기</label>'+
  '<textarea class="ta sm" id="purposeLine" data-f="pre.purposeLine" placeholder="이 발표가 끝나면 친구들이 무엇을 얻었으면 좋겠나요?">'+esc(p.purposeLine)+'</textarea>'+

  '<label class="fl"><span class="pcol">PEOPLE</span> &nbsp;듣는 사람은 우리 반 친구들</label>'+
  '<label class="fl" for="know" style="margin-top:8px">친구들이 이미 알고 있는 것</label>'+
  '<textarea class="ta sm" id="know" data-f="pre.know" placeholder="예) 김장이 뭔지는 다들 안다.">'+esc(p.know)+'</textarea>'+
  '<label class="fl" for="wonder">친구들이 궁금해할 것</label>'+
  '<textarea class="ta sm" id="wonder" data-f="pre.wonder" placeholder="예) 중2가 김장을 왜 도왔는지, 얼마나 힘들었는지">'+esc(p.wonder)+'</textarea>'+
  '<label class="fl" for="hook">첫 15초에 관심을 끌 한마디</label>'+
  '<textarea class="ta sm" id="hook" data-f="pre.hook" placeholder="예) 여러분, 배추 삼십 포기를 씻어 본 적 있나요?">'+esc(p.hook)+'</textarea>'+

  '<label class="fl"><span class="pcol">PLACE</span> &nbsp;말하는 자리의 조건<span>해당하는 것을 모두</span></label>'+
  '<div class="chips">'+places+'</div>'+
  '<textarea class="ta sm" id="placeLine" data-f="pre.placeLine" style="margin-top:8px" placeholder="그래서 조정할 것 &mdash; 예) 마이크가 없으니 뒷자리까지 들리게 목소리를 크게 낸다.">'+esc(p.placeLine)+'</textarea>'+
  '</div>'+

  '<div class="sub3"><h4 class="h">말하기 불안 점검</h4>'+
  '<label class="fl" for="anxLevel">지금 내 긴장은 어느 정도<span>'+(p.anxLevel||"-")+' / 5</span></label>'+
  '<input type="range" id="anxLevel" min="0" max="5" step="1" value="'+(p.anxLevel||0)+'" style="width:100%">'+
  '<label class="fl">긴장하면 내 몸에 나타나는 것<span>해당하는 것을 모두</span></label>'+
  '<div class="chips">'+signs+'</div>'+
  '<label class="fl">내 긴장의 가장 큰 원인은</label>'+
  chipRow(ANXCAUSE.map(function(x){return {k:x,label:x};}),p.anxCause,"data-anxcause","pl")+
  '<label class="fl" for="warmup">발표 직전에 할 나의 예열 루틴<span>한 가지만, 순서까지</span></label>'+
  '<textarea class="ta sm" id="warmup" data-f="pre.warmup" placeholder="예) 자리에서 4초 들이마시고 6초 내쉬기를 세 번 하고, 첫 문장만 속으로 한 번 말해 본다.">'+esc(p.warmup)+'</textarea>'+
  '<p class="tip">긴장을 지우는 것이 목표가 아닙니다. 긴장한 채로도 할 수 있는 <b>순서</b>를 만들어 두는 것이 목표입니다.</p>'+
  '</div></div>'+

  '<h3 class="sf h">계획 나누기</h3>'+
  '<p class="body" style="font-size:13.5px;margin-bottom:12px">세운 계획을 카드로 만들어 줍니다. 카드는 두 가지입니다. <strong>청중용</strong>은 캡처해 패들렛에 올려 발표하는 동안 모두가 함께 보고, <strong>발표자용</strong>은 준비한 내용이 다 담겨 있어 내 앞에 두고 봅니다. 대본 없이 말하는 첫 연습입니다.</p>'+
  '<div class="btnrow">'+
  '<button class="btn" id="openPlanCard"'+(planCardReady()?"":" disabled")+'>말하기 계획 카드 만들기</button>'+
  '<button class="ghost" id="toTalk">3단계로 &mdash; 대본 쓰고 발표하기</button></div>'+
  (planCardReady()
    ? '<p class="hint">카드 아래에서 발표자용과 청중용을 바꿔 가며 각각 캡처할 수 있습니다. 한 화면에 들어가야 해서 각 칸은 두세 줄에서 끊습니다.</p>'
    : '<p class="hint">말하고 싶은 경험과 말하기의 목적을 채우면 카드를 만들 수 있습니다.</p>')+
  '</div>';
}

/* ===================================================
   말하기 계획 카드 — 2단계를 마치고 패들렛에 올릴 한 장.
   3단계의 발표 자료가 넘기는 슬라이드라면, 이것은 한 화면에
   다 담겨야 하므로 각 칸을 두세 줄에서 끊는다.
   =================================================== */
function planCardReady(){
  return !!(S.pre.topic && (S.pre.purpose || S.goals.length));
}
function pcVal(t){
  return (t && String(t).trim()) ? esc(t) : '<span class="none">아직 안 썼어요</span>';
}
/* 발표자용 : 내가 발표하면서 곁에 두고 보는 카드. 준비한 것이 다 들어간다. */
function planCardSpeaker(){
  var p = S.pre, s = S.scores;
  var T = s ? TYPES[decideType(s).key] : null;
  var who = ((S.sid||"") + " " + (S.sname||"")).trim() || "이름 없음";
  var places = Object.keys(p.place||{}).filter(function(k){ return p.place[k]; });
  var pur = PURPOSE.filter(function(x){ return x.k===p.purpose; })[0];
  var purText = pur ? ('<em>'+esc(pur.label)+'</em>' + (p.purposeLine ? ' &middot; '+esc(p.purposeLine) : ''))
                    : pcVal(p.purposeLine);
  return '<div class="pc">'+
    '<div class="pc-head"><span class="pc-who">'+esc(who)+'</span>'+
    (T?'<span class="pc-type">'+T.icon+' <b>'+esc(T.name)+'</b></span>':'')+'</div>'+
    '<div class="pc-body">'+
    '<div class="pc-topic">'+pcVal(p.topic)+'</div>'+
    (p.why?'<div class="pc-why">'+esc(p.why)+'</div>':'')+
    (S.goals.length?
      '<div class="pc-goal"><div class="lab">이번 말하기에서 꼭 지킬 것</div>'+
      '<div class="txt">'+esc(goalList()[0])+'</div></div>':'')+
    '<div class="pc-rows">'+
    '<div class="pc-row"><div class="pc-key">목적</div><div class="pc-val">'+purText+'</div></div>'+
    '<div class="pc-row"><div class="pc-key">청중</div><div class="pc-val">'+
      (p.wonder ? '궁금해할 것 &mdash; '+esc(p.wonder) : pcVal(p.know))+'</div></div>'+
    '<div class="pc-row"><div class="pc-key">자리</div><div class="pc-val">'+
      (places.length ? esc(places.join(" · ")) : pcVal(p.placeLine))+'</div></div>'+
    '</div>'+
    '<div class="pc-gap"></div>'+
    (p.hook?'<div class="pc-hook">“'+esc(p.hook)+'”</div>':'')+
    '<div class="pc-foot">'+
    '<span>예열 &mdash; '+pcVal(p.warmup)+'</span>'+
    (p.anxLevel?'<span class="pc-nerve">긴장 <b>'+p.anxLevel+'</b>/5</span>':'')+
    '</div></div></div>';
}
/* 청중용 : 발표하는 동안 띄워 두는 카드.
   준비 내용을 미리 읽히면 청중의 눈이 화면에 묶이므로,
   누가 무엇을 말하는지와 '어디를 보고 들을지'만 남긴다. */
function planCardAudience(){
  var p = S.pre;
  var who = ((S.sid||"") + " " + (S.sname||"")).trim() || "이름 없음";
  return '<div class="pc">'+
    '<div class="pc-head"><span class="pc-who">'+esc(who)+'</span></div>'+
    '<div class="pc-aud">'+
    '<div class="pc-aud-label">오늘 들려줄 이야기</div>'+
    '<div class="pc-aud-topic">'+pcVal(p.topic)+'</div>'+
    (S.goals.length?
      '<div class="pc-aud-goal"><div class="lab">이 발표에서 지켜볼 것</div>'+
      '<div class="txt">'+esc(goalList()[0])+'</div></div>'+
      '<div class="pc-aud-ask">이 한 가지가 <b>실제로 일어났는지</b> 보면서 들어 주세요.<br>'+
      '본 장면을 근거로 이야기해 주면 가장 큰 도움이 됩니다.</div>'
      :'<div class="pc-aud-ask" style="margin-top:26px">1단계에서 목표를 정하면 여기에 들어갑니다.</div>')+
    '</div></div>';
}
function paintPlanCard(){
  var box = document.getElementById("pcard");
  if(!S.pcard.on){ box.className="off"; box.innerHTML=""; return; }
  box.className = "";
  var aud = (S.pcard.mode === "audience");

  box.innerHTML =
    (aud ? planCardAudience() : planCardSpeaker())+
    '<div class="pcbar">'+
    '<span class="pcseg">'+
    '<button data-pcmode="speaker" class="'+(aud?"":"on")+'">발표자용</button>'+
    '<button data-pcmode="audience" class="'+(aud?"on":"")+'">청중용</button>'+
    '</span>'+
    '<span>'+(aud ? '이 화면을 캡처해 패들렛에 올리세요'

/* =================== 3단계 : 대본 -> 키워드 -> 발표 자료 =================== */
function lenMsg(sec){

       : (sec>180 ? "3분을 넘습니다 — 덜 중요한 대목을 덜어 내세요" : "1~3분 안에 들어옵니다");
}
function meterHTML(){
  var sec = speakSeconds(S.talk.script);
  var chars = (S.talk.script||"").replace(/\s/g,"").length;
  return '<span><b>'+mmss(sec)+'</b> 예상 시간</span><span>'+chars+'자</span>'+
         '<span style="font-size:12px">'+lenMsg(sec)+'</span>';
}

                  :'<p class="hint">핵심어를 한 개 이상 채우면 발표 자료를 띄울 수 있습니다.</p>');

function viewTalk(){
  var t=S.talk;

/* =================== 발표 자료 (전체 화면) =================== */
var deckTimer = null;
function slidesOf(){
  var a = [{type:"title"}];
  S.talk.keywords.forEach(function(k){ if(k) a.push({type:"kw",text:k}); });
  return a;
}
function paintDeck(){
  var d = document.getElementById("deck");
  if(!S.deck.on){ d.className="off"; d.innerHTML=""; return; }
  d.className="";
  var sl = slidesOf(), i = Math.max(0, Math.min(S.deck.i, sl.length-1));
  S.deck.i = i;
  var cur = sl[i], body;
  if(cur.type==="title"){
    body = '<div class="dtitle">'+esc(S.pre.topic||"나의 경험 이야기")+'</div>'+
           '<div class="dwho">'+esc((S.sname||"")+(S.sid?(" · "+S.sid):""))+'</div>';
  } else {
    body = '<div class="dnum">'+i+' / '+(sl.length-1)+'</div><div class="dkw">'+esc(cur.text)+'</div>';
  }
  var pl = PARA.filter(function(x){return x.k===S.cue.para;})[0];
  var nl = NONPARA.filter(function(x){return x.k===S.cue.nonpara;})[0];
  var cues = "";
  if(S.deck.showCues && (pl||nl)){
    cues = '<div class="dcues">'+
      (pl?'<span>'+esc(pl.label)+'</span> '+esc(S.cue.paraFix||pl.fix)+'<br>':'')+
      (nl?'<span>'+esc(nl.label)+'</span> '+esc(S.cue.nonparaFix||nl.fix):'')+'</div>';
  } else {
    cues = '<div class="dcues" style="color:#7E93A0">점검 신호 숨김</div>';
  }
  var dots = '<div class="ddots">';
  sl.forEach(function(x,j){ dots += '<i class="'+(j===i?"on":"")+'"></i>'; });
  dots += '</div>';
  var tcls = S.deck.sec>180 ? "over" : (S.deck.sec>150 ? "warn" : "");

  d.innerHTML =
    '<div class="dstage" id="dstage">'+body+'</div>'+
    '<div class="dfoot">'+cues+
    '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'+dots+
    '<span class="dtime '+tcls+'" id="dtime">'+mmss(S.deck.sec)+'</span>'+
    '<button class="dx" id="dcue">'+(S.deck.showCues?"신호 숨기기":"신호 보기")+'</button>'+
    '<button class="dx" id="dclose">닫기 (ESC)</button></div></div>';

  document.getElementById("dstage").addEventListener("click", function(){ deckNext(1); });
  document.getElementById("dcue").addEventListener("click", function(){
    S.deck.showCues = !S.deck.showCues; paintDeck();
  });
  document.getElementById("dclose").addEventListener("click", closeDeck);
}
function deckNext(step){
  var n = slidesOf().length;
  S.deck.i = Math.max(0, Math.min(S.deck.i + step, n-1));
  paintDeck();
}
function openDeck(){
  S.deck.on = true; S.deck.i = 0; S.deck.sec = 0;
  paintDeck();
  if(deckTimer) clearInterval(deckTimer);
  deckTimer = setInterval(function(){
    S.deck.sec++;
    var el = document.getElementById("dtime");
    if(el){
      el.textContent = mmss(S.deck.sec);
      el.className = "dtime " + (S.deck.sec>180?"over":(S.deck.sec>150?"warn":""));
    }
  }, 1000);
}
function closeDeck(){
  S.deck.on = false;
  if(deckTimer){ clearInterval(deckTimer); deckTimer=null; }
  paintDeck();
}

function fbText(){
  var out = "[말하기 피드백] " + (S.sid?S.sid+" ":"") + (S.sname||"") + "\n";
  S.fb.given.forEach(function(g,i){
    out += "\n" + (i+1) + ". " + g.name + " — 목표 달성: " + (g.mark||"-") + "\n";
    if(g.goal) out += "   목표: " + g.goal + "\n";
    if(g.why)  out += "   근거: " + g.why + "\n";
    if(g.good) out += "   좋았던 점: " + g.good + "\n";
    if(g.next) out += "   제안: " + g.next + "\n";
  });
  return out;
}
function fbCsv(){
  function q(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; }
  var rows = [["쓴사람학번","쓴사람이름","발표자","목표","목표달성","근거","좋았던점","제안"].map(q).join(",")];
  S.fb.given.forEach(function(g){
    rows.push([S.sid,S.sname,g.name,g.goal,g.mark,g.why,g.good,g.next].map(q).join(","));
  });
  return "﻿" + rows.join("\r\n");
}

/* =================== 렌더 =================== */
var lastView = null;
function render(){
  /* 같은 화면을 다시 그릴 때는 보던 자리를 지킨다.
     (선택지 하나 눌렀다고 맨 위로 튀어 올라가지 않도록) */
  var keep = (lastView === S.view);
  var y = window.pageYOffset || document.documentElement.scrollTop || 0;
  if(S.view==="intro") app.innerHTML = viewIntro();
  else if(S.view==="quiz") app.innerHTML = viewQuiz();
  else if(S.view==="result") app.innerHTML = viewResult();
  else if(S.view==="plan") app.innerHTML = viewPlan();
  else if(S.view==="talk") app.innerHTML = viewTalk();
  else app.innerHTML = viewReflect();
  paintTop();
  bind();
  save();
  window.scrollTo(0, keep ? y : 0);
  lastView = S.view;
}
function setPath(path,val){
  var parts = path.split("."), o = S, i;
  for(i=0;i<parts.length-1;i++) o = o[parts[i]];
  o[parts[parts.length-1]] = val;
}
function bindFields(){
  app.querySelectorAll("[data-f]").forEach(function(el){
    el.addEventListener("input", function(){
      setPath(this.getAttribute("data-f"), this.value);
      save();
      if(this.id==="script") queueTalkRepaint();
    });
  });
}
var talkTimer = null;
function queueTalkRepaint(){
  /* 숫자는 바로, 핵심어 구획은 잠깐 멈춘 뒤에 다시 그린다 */
  var sec = speakSeconds(S.talk.script);
  var m = document.getElementById("meter");
  if(m) m.innerHTML = meterHTML();
  var g = document.getElementById("gauge");
  if(g){
    g.className = "gauge " + (sec<60?"lo":(sec>180?"hi":""));
    g.querySelector("i").style.width = Math.max(2, Math.min(100, Math.round(sec/210*100))) + "%";
  }
  if(talkTimer) clearTimeout(talkTimer);
  talkTimer = setTimeout(repaintTalkZones, 350);
}
function repaintTalkZones(){
  var z = document.getElementById("kwzone");
  if(!z) return;
  z.innerHTML = kwZoneHTML();
  var a = document.getElementById("actzone");
  if(a) a.innerHTML = actZoneHTML();
  bindTalkZones();
}
function pick(v){
  S.answers[SEQ[S.idx].id] = v;
  if(S.idx < SEQ.length-1) S.idx++;
  render();
}
/* 3단계의 핵심어 구획은 대본을 고칠 때마다 다시 그려지므로 따로 묶어 둔다 */
function bindTalkZones(){
  var el;
  document.querySelectorAll("[data-kw]").forEach(function(b){
    b.addEventListener("click", function(){
      var w=this.getAttribute("data-kw"), at=S.talk.keywords.indexOf(w), i;
      if(at>=0){ S.talk.keywords[at]=""; save(); repaintTalkZones(); return; }
      for(i=0;i<3;i++) if(!S.talk.keywords[i]){
        S.talk.keywords[i]=w; save(); repaintTalkZones(); return;
      }
      toast("세 칸이 모두 찼습니다 — 하나를 눌러 비우세요");
    });
  });
  document.querySelectorAll("[data-kwi]").forEach(function(inp){
    inp.addEventListener("input", function(){
      S.talk.keywords[+this.getAttribute("data-kwi")] = this.value;
      save();
      var a = document.getElementById("actzone");
      if(a){ a.innerHTML = actZoneHTML(); bindActZone(); }
    });
  });
  el=document.getElementById("autoPick");
  if(el) el.addEventListener("click", function(){
    var c = extractKeywords(S.talk.script, 3);
    S.talk.keywords = [c[0]||"", c[1]||"", c[2]||""];
    save(); repaintTalkZones();
  });
  el=document.getElementById("clearKw");
  if(el) el.addEventListener("click", function(){
    S.talk.keywords=["","",""]; save(); repaintTalkZones();
  });
  bindActZone();
}
function bindActZone(){
  var el=document.getElementById("openDeck");
  if(el) el.addEventListener("click", openDeck);
  el=document.getElementById("toMid");
  if(el) el.addEventListener("click", function(){
    var t = document.getElementById("midcheck");
    if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  });
}
function bind(){
  var el;
  bindFields();

  if(S.view==="intro"){
    document.getElementById("go").addEventListener("click", function(){
      /* 저장된 내용이 있으면 한 번 더 확인받는다. 큰 버튼을 잘못 눌러
         지난 시간 목표를 날리는 일이 교실에서 가장 흔한 사고다. */
      if(storeGet(SKEY) && !S.ui.confirmNew){ S.ui.confirmNew = true; render(); return; }
      var keep = S.ui;
      S = freshState(); S.ui = keep; S.ui.confirmNew = false;
      S.view="quiz"; S.idx=0; render();
    });
    el = document.getElementById("resume");
    if(el) el.addEventListener("click", function(){
      if(loadSaved()){ render(); toast("이어서 합니다"); }
      else toast("저장된 내용이 없습니다");
    });
    el = document.getElementById("introUp");
    if(el) el.addEventListener("click", function(){
      document.getElementById("upFile").click();
    });
  }

  if(S.view==="quiz"){
    app.querySelectorAll(".opt").forEach(function(b){
      b.addEventListener("click", function(){ pick(+this.getAttribute("data-v")); });
    });
    el=document.getElementById("prev");
    if(el) el.addEventListener("click", function(){ if(S.idx>0){S.idx--;render();} });
    el=document.getElementById("next");
    if(el) el.addEventListener("click", function(){ if(S.idx<SEQ.length-1){S.idx++;render();} });
    el=document.getElementById("finish");
    if(el) el.addEventListener("click", function(){
      S.scores = computeScores(S.answers);
      S.flat = uniformAnswer(S.answers);
      S.view = "result"; render();
    });
  }

  if(S.view==="result"){
    app.querySelectorAll(".rxpick").forEach(function(b){
      b.addEventListener("click", function(){
        /* 목표는 딱 하나. 같은 것을 다시 누르면 해제, 다른 것을 누르면 교체한다. */
        var phase=this.getAttribute("data-phase"), text=this.getAttribute("data-text");
        var had = S.goals.length>0;
        if(had && S.goals[0].phase===phase && S.goals[0].text===text){
          S.goals = []; render(); return;
        }
        S.goals = [{phase:phase, text:text, refined:""}];
        render();
        if(had) toast("목표를 바꿨습니다");
      });
    });
    app.querySelectorAll("[data-ref]").forEach(function(t){
      t.addEventListener("input", function(){
        S.goals[+this.getAttribute("data-ref")].refined = this.value;
        save();
      });
    });
    app.querySelectorAll("[data-drop]").forEach(function(b){
      b.addEventListener("click", function(){
        S.goals.splice(+this.getAttribute("data-drop"),1); render();
      });
    });
    el=document.getElementById("sid");
    if(el) el.addEventListener("input", function(){ S.sid=this.value; save(); });
    el=document.getElementById("sname");
    if(el) el.addEventListener("input", function(){ S.sname=this.value; save(); });
    el=document.getElementById("toPlan");
    if(el) el.addEventListener("click", function(){ S.view="plan"; render(); });
    el=document.getElementById("again");
    if(el) el.addEventListener("click", function(){
      S.answers={}; S.scores=null; S.goals=[]; S.idx=0; S.view="quiz"; render();
    });
  }

  if(S.view==="plan"){
    app.querySelectorAll("[data-purpose]").forEach(function(b){
      b.addEventListener("click", function(){
        S.pre.purpose = (S.pre.purpose===this.getAttribute("data-purpose")) ? "" : this.getAttribute("data-purpose");
        render();
      });
    });
    app.querySelectorAll("[data-sign]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-sign");
        S.pre.anxSigns[k] = !S.pre.anxSigns[k]; render();
      });
    });
    app.querySelectorAll("[data-place]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-place");
        S.pre.place[k] = !S.pre.place[k]; render();
      });
    });
    app.querySelectorAll("[data-anxcause]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-anxcause");
        S.pre.anxCause = (S.pre.anxCause===k) ? "" : k; render();
      });
    });
    el=document.getElementById("anxLevel");
    if(el) el.addEventListener("input", function(){ S.pre.anxLevel=+this.value; save();
      var lab=app.querySelector('label[for="anxLevel"] span');
      if(lab) lab.textContent = this.value + " / 5";
    });
    bindTimer();
    el=document.getElementById("seedOpen");
    if(el) el.addEventListener("click", function(){ S.ui.seeds=true; render(); });
    el=document.getElementById("seedClose");
    if(el) el.addEventListener("click", function(){ S.ui.seeds=false; render(); });
    app.querySelectorAll("[data-seed]").forEach(function(b){
      b.addEventListener("click", function(){
        S.pre.topic = this.getAttribute("data-seed");
        S.ui.seeds = false; render();
        toast("골랐습니다 — 내 이야기에 맞게 고쳐 쓰세요");
      });
    });
    el=document.getElementById("openPlanCard");
    if(el) el.addEventListener("click", openPlanCard);
    el=document.getElementById("toTalk");
    if(el) el.addEventListener("click", function(){ S.view="talk"; render(); });
  }

  if(S.view==="talk"){
    bindTalkZones();
    app.querySelectorAll("[data-para]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-para");
        if(S.cue.para===k){ S.cue.para=""; S.cue.paraFix=""; }
        else { S.cue.para=k; S.cue.paraFix=(PARA.filter(function(x){return x.k===k;})[0]||{}).fix||""; }
        render();
      });
    });
    app.querySelectorAll("[data-nonpara]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-nonpara");
        if(S.cue.nonpara===k){ S.cue.nonpara=""; S.cue.nonparaFix=""; }
        else { S.cue.nonpara=k; S.cue.nonparaFix=(NONPARA.filter(function(x){return x.k===k;})[0]||{}).fix||""; }
        render();
      });
    });
    app.querySelectorAll("[data-donep]").forEach(function(b){
      b.addEventListener("click", function(){ S.cue.doneP = this.getAttribute("data-donep"); render(); });
    });
    app.querySelectorAll("[data-donen]").forEach(function(b){
      b.addEventListener("click", function(){ S.cue.doneN = this.getAttribute("data-donen"); render(); });
    });
    el=document.getElementById("toReflect");
    if(el) el.addEventListener("click", function(){ S.view="reflect"; render(); });
  }

  if(S.view==="reflect"){
    app.querySelectorAll("[data-mode]").forEach(function(b){
      b.addEventListener("click", function(){
        S.fb.mode = this.getAttribute("data-mode"); render();
      });
    });
    app.querySelectorAll("[data-fbmark]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-fbmark");
        S.fb.draft.mark = (S.fb.draft.mark===k) ? "" : k; render();
      });
    });
    app.querySelectorAll("[data-audmark]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-audmark");
        S.fb.audienceMark = (S.fb.audienceMark===k) ? "" : k; render();
      });
    });
    app.querySelectorAll("[data-fbdrop]").forEach(function(b){
      b.addEventListener("click", function(){
        S.fb.given.splice(+this.getAttribute("data-fbdrop"),1); render();
      });
    });
    /* 이름을 적는 순간 저장 버튼이 열리도록 (전체 새로 그리지 않고) */
    el=document.getElementById("fbname");
    if(el) el.addEventListener("input", function(){
      var b=document.getElementById("fbsave");
      if(b) b.disabled = !this.value.trim();
    });
    el=document.getElementById("fbsave");
    if(el) el.addEventListener("click", function(){
      var d=S.fb.draft;
      if(!d.name) return;
      S.fb.given.push({name:d.name,goal:d.goal,mark:d.mark,why:d.why,good:d.good,next:d.next});
      S.fb.draft = {name:"",goal:"",mark:"",why:"",good:"",next:""};
      render(); toast("저장했습니다 — 다음 발표자로");
    });
    el=document.getElementById("fbcopy");
    if(el) el.addEventListener("click", function(){
      var txt = fbText();
      var done = function(){ toast("복사했습니다"); };
      var fail = function(){
        var ta=document.createElement("textarea");
        ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); done(); }catch(e){ toast("복사가 안 됩니다 — 인쇄를 이용하세요"); }
        ta.remove();
      };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(txt).then(done).catch(fail);
        else fail();
      }catch(e){ fail(); }
    });
    el=document.getElementById("fbcsv");
    if(el) el.addEventListener("click", function(){
      saveFile("말하기피드백_"+(S.sid||"")+(S.sname?("_"+S.sname):"")+".csv",
               fbCsv(), "text/csv;charset=utf-8");
    });
    app.querySelectorAll("[data-cause]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-cause");
        S.post.cause = (S.post.cause===k) ? "" : k; render();
      });
    });
    app.querySelectorAll("[data-goalcheck]").forEach(function(b){
      b.addEventListener("click", function(){
        var k=this.getAttribute("data-goalcheck");
        S.post.goalCheck = (S.post.goalCheck===k) ? "" : k; render();
      });
    });
  }
}

/* =================== 키보드 =================== */
document.addEventListener("keydown", function(e){
  if(TIMER.full){
    if(e.key==="Escape"){ TIMER.full=false; paintFullTimer(); }
    return;
  }
  if(S.pcard.on){
    if(e.key==="Escape") closePlanCard();
    return;
  }
  if(S.deck.on){
    if(e.key==="Escape") closeDeck();
    else if(e.key==="ArrowRight"||e.key===" "||e.key==="Enter") { e.preventDefault(); deckNext(1); }
    else if(e.key==="ArrowLeft") deckNext(-1);
    return;
  }
  if(S.view!=="quiz") return;
  if(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(["1","2","3","4","5"].indexOf(e.key)>=0) pick(+e.key);
  else if(e.key==="ArrowLeft" && S.idx>0){ S.idx--; render(); }
  else if(e.key==="ArrowRight" && S.idx<SEQ.length-1){ S.idx++; render(); }
});

window.addEventListener("beforeprint", buildSheet);

render();
</script>
